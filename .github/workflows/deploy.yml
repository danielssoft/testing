name: Deploy app

on:
  repository_dispatch:
    types: [deploy-app]

  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to deploy"
        required: true
        type: string

concurrency:
  group: central-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      OWNER: danielssoft
      CENTRAL_REPO: testing
      TARGET_REPO: ${{ github.event.client_payload.repo || inputs.repo }}

    steps:
      - name: Validate repository name
        shell: bash
        run: |
          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid repository name: $TARGET_REPO"
            exit 1
          fi

          echo "Deploying: $TARGET_REPO"

      - name: Clone application from main
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone \
            --depth 1 \
            --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${TARGET_REPO}.git" \
            /tmp/app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: /tmp/app
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build application
        working-directory: /tmp/app
        run: |
          if grep -q '"vite"' package.json; then
            echo "Vite detected"
            echo "Base: /${CENTRAL_REPO}/${TARGET_REPO}/"

            npx vite build \
              --base="/${CENTRAL_REPO}/${TARGET_REPO}/"
          else
            echo "Unsupported project type. Expected Vite."
            exit 1
          fi

      - name: Verify build
        run: |
          if [ ! -d /tmp/app/dist ]; then
            echo "dist folder not found."
            exit 1
          fi

      - name: Clone central repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${CENTRAL_REPO}.git" \
            /tmp/pages

      - name: Prepare gh-pages branch
        working-directory: /tmp/pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

      - name: Deploy application
        working-directory: /tmp/pages
        run: |
          rm -rf "${TARGET_REPO}"
          mkdir -p "${TARGET_REPO}"

          cp -r /tmp/app/dist/. "${TARGET_REPO}/"

          touch .nojekyll

      - name: Generate index page
        working-directory: /tmp/pages
        run: |
          {
            cat <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Projects</title>
          <style>
            :root { color-scheme: light dark }
            body {
              font: 16px/1.5 system-ui, sans-serif;
              margin: 4rem auto;
              padding: 0 1.5rem;
              max-width: 34rem;
            }
            h1 { font-size: 1.5rem; margin-bottom: 2rem }
            ul { list-style: none; padding: 0 }
            li + li { margin-top: .5rem }
            a {
              display: block;
              padding: .75rem 1rem;
              border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
              border-radius: .5rem;
              text-decoration: none;
              color: inherit;
            }
            a:hover { border-color: currentColor }
          </style>
          <h1>Projects</h1>
          <ul>
          HTML

            for dir in */; do
              name="${dir%/}"
              echo "<li><a href=\"${name}/\">${name}</a></li>"
            done

            echo '</ul>'
          } > index.html

      - name: Commit and push gh-pages
        working-directory: /tmp/pages
        run: |
          git config user.name "Auto Deployer"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Deploy ${TARGET_REPO}"

          git push origin gh-pages