name: Deploy app

on:
  repository_dispatch:
    types: [deploy-app]

  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to deploy"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      OWNER: danielssoft
      TARGET_REPO: ${{ github.event.client_payload.repo || inputs.repo }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository name
        run: |
          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid repository name: $TARGET_REPO"
            exit 1
          fi

      - name: Check deploy topic
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          topics=$(gh api \
            "/repos/${OWNER}/${TARGET_REPO}/topics" \
            --jq '.names[]' 2>/dev/null || true)

          if ! echo "$topics" | grep -qx "deploy"; then
            echo "Repository '$TARGET_REPO' does not have topic 'deploy'."
            exit 1
          fi

      - name: Clone source repository from main
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone \
            --depth 1 \
            --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${TARGET_REPO}.git" \
            /tmp/app

      - name: Install dependencies
        working-directory: /tmp/app
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile

          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile

          elif [ -f package-lock.json ]; then
            npm ci

          else
            npm install
          fi

      - name: Build app
        working-directory: /tmp/app
        run: |
          if grep -q '"vite"' package.json; then
            echo "Building Vite project: ${TARGET_REPO}"

            npx vite build --base="/${TARGET_REPO}/"
          else
            echo "Unsupported project type. Currently expecting Vite."
            exit 1
          fi

      - name: Verify build output
        run: |
          if [ ! -d /tmp/app/dist ]; then
            echo "Build failed: dist directory not found."
            exit 1
          fi

      - name: Clone GitHub Pages repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone \
            --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${OWNER}.github.io.git" \
            /tmp/pages

      - name: Replace deployed app
        run: |
          rm -rf "/tmp/pages/${TARGET_REPO}"

          mkdir -p "/tmp/pages/${TARGET_REPO}"

          cp -r /tmp/app/dist/. "/tmp/pages/${TARGET_REPO}/"

          touch /tmp/pages/.nojekyll

      - name: Commit deployment
        working-directory: /tmp/pages
        run: |
          git config user.name "Auto Deployer"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi

          git commit -m "Deploy ${TARGET_REPO}"

      - name: Push deployment
        working-directory: /tmp/pages
        run: |
          git push