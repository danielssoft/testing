name: Deploy app

on:
  repository_dispatch:
    types: [deploy-app]

  workflow_dispatch:
    inputs:
      repo:
        description: "Repository to deploy"
        required: true
        type: string

concurrency:
  group: central-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      OWNER: danielsssoft
      TARGET_REPO: ${{ github.event.client_payload.repo || inputs.repo }}

    steps:
      - name: Validate repository name
        shell: bash
        run: |
          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid repository name: $TARGET_REPO"
            exit 1
          fi

          echo "Deploying: $TARGET_REPO"

      - name: Clone application from main
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone \
            --depth 1 \
            --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${TARGET_REPO}.git" \
            /tmp/app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: /tmp/app
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile

          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile

          elif [ -f package-lock.json ]; then
            npm ci

          else
            npm install
          fi

      - name: Build application
        working-directory: /tmp/app
        run: |
          if grep -q '"vite"' package.json; then
            echo "Vite detected"
            echo "Base: /${TARGET_REPO}/"

            npx vite build --base="/${TARGET_REPO}/"
          else
            echo "Unsupported project type. Expected Vite."
            exit 1
          fi

      - name: Verify build
        run: |
          if [ ! -d /tmp/app/dist ]; then
            echo "dist folder not found."
            exit 1
          fi

      - name: Clone GitHub Pages repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone \
            --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${OWNER}.github.io.git" \
            /tmp/pages

      - name: Replace deployed application
        run: |
          rm -rf "/tmp/pages/${TARGET_REPO}"
          mkdir -p "/tmp/pages/${TARGET_REPO}"

          cp -r /tmp/app/dist/. "/tmp/pages/${TARGET_REPO}/"

          touch /tmp/pages/.nojekyll

      - name: Commit and push deployment
        working-directory: /tmp/pages
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config user.name "Auto Deployer"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Deploy ${TARGET_REPO}"

          git push