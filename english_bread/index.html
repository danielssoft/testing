<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon-alt.svg" />
    <!-- Pinch zoom is off, by choice, after trying it on.
         `touch-action: pan-y` on the card does stop a swipe turning into a
         horizontal scroll, so the meta is not needed for that — but the layout
         is one column at the width of the screen, so zooming reveals nothing
         and mostly happens by accident while handling cards. Text can still be
         enlarged where it matters: the OS font-size setting applies, because
         nothing here pins a text size against it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The dark --background from src/styles.css, and the default. Not
         media-switched: the app is dark whatever the system prefers, and light
         is a setting. Both this and `data-theme` are rewritten below, and again
         from settings.ts whenever the setting changes. -->
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="English grammar trainer" />
    <title>English Bread | For u</title>
    <script type="module" crossorigin src="/testing/english_bread/assets/index-cvXf-IF4.js"></script>
    <link rel="modulepreload" crossorigin href="/testing/english_bread/assets/vendor-XO20boz-.js">
    <link rel="stylesheet" crossorigin href="/testing/english_bread/assets/vendor-BnuhLJ6X.css">
    <link rel="stylesheet" crossorigin href="/testing/english_bread/assets/index-DN06ocIQ.css">
  <link rel="manifest" href="/testing/english_bread/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/testing/english_bread/registerSW.js"></script></head>
  <body>
    <!-- Before the first paint, so choosing light does not mean a black flash
         on every load. Inline and synchronous for that reason: the module
         below is deferred, and by the time it runs the page is already up.
         It reads the same key settings.ts writes, and guesses nothing if it
         cannot: dark is what the stylesheet does anyway. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('english-bread:settings:v1') || '{}')
        if (saved.theme === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#ffffff'
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
  </body>
</html>
